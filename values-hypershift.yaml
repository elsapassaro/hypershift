# Shared values for the libvirt/BM Tekton-only pattern.
# Installed on the existing BM hub. MCE, hosted-cluster provisioning, S3 OIDC,
# and AWS autoscaling are intentionally omitted.

global:
  # GitHub organization(s) — used only if oauth.type is GitHub and groupsync is enabled.
  github:
    orgs:
    - name: validatedpatterns
      teams:
      - Engineering
      - qe
      - Docs

  oauth:
    # HTPasswd uses the lab users in /home/kni/users.htpasswd (loaded via Vault).
    # This applies on the hub (BareMetal). Guest OAuth CRs on hosted clusters are immutable.
    # Switch to GitHub by setting type: GitHub, secretName: ocp-github-oauth, and providing oauthCreds.
    type: HTPasswd
    secretName: htpasswd-secret
    github:
      clientID: 'Ov23liX8pobrzJV3I5S0'

  groupsync:
    secretName: github-group-sync
    github:
      credentialsSecretName: github-group-sync
      url: https://api.github.com/

# Local PVs only for platform None (hosted). Hub BareMetal uses hostpath-csi.
localStorage:
  enabled: false
  storageClassName: lab-hostpath
  setDefault: true
  pathPrefix: /var/lab-pvs
  volumeSize: 10Gi
  volumesPerNode: 6
  nodes: []

# KubeletConfig is disabled on this branch. Compact 3-node hub has an empty worker MCP.
kubelet:
  targetPool: master

# Set rbac.create to false if you want to skip creation of role/rolebinding.
rbac:
  create: true
  users: []
  groups:
  - ci-users
  sudoerGroups: []

# Tekton / OpenShift Pipelines (charts/all/pipelines-rbac)
pipelinesRbac:
  create: true
  clusterRoleName: openshift-pipelines-tekton-admin
  clusterRoleBindingName: openshift-pipelines-tekton-admin
  includePodLogAccess: true
  users: []
  groups:
    - ci-users
  localGroup:
    name: ci-users
    users:
      - epassaro
      - ugreener
      - ikandel

# Argo CD / OpenShift GitOps Application CRs (charts/all/argocd-application-rbac)
argocdApplicationRbac:
  create: true
  clusterRoleName: openshift-gitops-application-manager
  clusterRoleBindingName: openshift-gitops-application-manager
  includeArgoCdOperatorCr: false
  users: []
  groups:
    - ci-users
