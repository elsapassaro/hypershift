clusterGroup:
  name: prod
  isHubCluster: true
  sharedValueFiles:
    - /values-hypershift.yaml
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
    - '/overrides/values-{{ $.Values.global.clusterVersion }}-{{ $.Values.clusterGroup.name }}.yaml'

  namespaces:
    vault:
    golang-external-secrets:
      disabled: true
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    openshift-pipelines:
    vp-qe-ci:
    local-storage:
    # MCE / HyperShift are already present on this hub. Do not subscribe or
    # reconfigure them, and do not provision another hosted cluster.
    multicluster-engine:
      disabled: true
    cluster-provisioning:
      disabled: true
    group-sync-operator:
      disabled: true

  # Operator subscriptions default to sync wave 0. Give them an explicit early band so
  # CSVs exist before Applications that install CRs for those operators (Argo advances
  # waves only after prior-wave resources are Synced + Healthy where health applies).
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
      annotations:
        argocd.argoproj.io/sync-wave: "5"

    # Already installed on the BM hub; do not subscribe again.
    mce:
      disabled: true
      name: multicluster-engine
      namespace: multicluster-engine
      channel: stable-2.17
      annotations:
        argocd.argoproj.io/sync-wave: "5"

    openshift-pipelines:
      name: openshift-pipelines-operator-rh
      channel: latest

    groupsync:
      disabled: true
      name: group-sync-operator
      namespace: group-sync-operator
      source: community-operators
      channel: alpha
      annotations:
        argocd.argoproj.io/sync-wave: "5"

  argoProjects:
    - hub
    - pipelines
    - infrastructure

  # Hub Applications: assign argocd.argoproj.io/sync-wave on every Argo Application so
  # ordering is explicit. Argo advances waves only after resources in the current wave
  # are Synced and Healthy.
  applications:
    vault:
      name: vault
      namespace: vault
      project: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "28"

    golang-external-secrets:
      disabled: true

    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
      chart: openshift-external-secrets
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "38"

    # AWS Route53 DNS-01. Not used on libvirt/BM.
    cert-manager:
      disabled: true
      name: openshift-cert-manager
      namespace: cert-manager-operator
      argoProject: hub
      chart: letsencrypt
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "22"
      ignoreDifferences:
        - group: argoproj.io
          kind: ArgoCD
          jqPathExpressions:
            - .metadata.annotations

    # AWS MachineSet autoscaler. Hosted cluster workers are NodePools on the hub.
    autoscaler:
      disabled: true
      name: cluster-autoscaler
      namespace: openshift-machine-api
      argoProject: hub
      chart: cluster-autoscaler
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "15"

    # Skip HyperShift operator/config; the hub already hosts hcptest-0.
    hypershift:
      disabled: true
      name: hypershift
      namespace: multicluster-engine
      argoProject: hub
      chart: hypershift-config
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "18"

    # AWS Hive/HyperShift cluster-provisioning pipelines (would create hosted clusters).
    pipelines:
      disabled: true
      name: pipelines
      namespace: openshift-pipelines
      argoProject: pipelines
      path: charts/all/pipelines
      chart: cluster-pipelines
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "18"

    pipeline-tekton-rbac:
      disabled: false
      name: pipeline-tekton-rbac
      namespace: openshift-pipelines
      argoProject: pipelines
      path: charts/all/pipelines-rbac
      annotations:
        argocd.argoproj.io/sync-wave: "19"

    argocd-application-rbac:
      disabled: false
      name: argocd-application-rbac
      namespace: openshift-gitops
      argoProject: hub
      path: charts/all/argocd-application-rbac
      annotations:
        argocd.argoproj.io/sync-wave: "17"

    # AWS IAM / hive credentials. Pull secret is already on the cluster.
    credentials:
      disabled: true
      name: pattern-credentials
      namespace: cluster-provisioning
      argoProject: infrastructure
      path: charts/all/pattern-credentials
      annotations:
        argocd.argoproj.io/sync-wave: "50"

    oauth:
      disabled: false
      name: oauth
      namespace: openshift-config
      argoProject: hub
      path: charts/all/oauth
      annotations:
        argocd.argoproj.io/sync-wave: "50"

    groupsync:
      disabled: true
      name: groupsync
      namespace: group-sync-operator
      argoProject: hub
      path: charts/all/groupsync
      annotations:
        argocd.argoproj.io/sync-wave: "60"

    hypershift-cli:
      disabled: true
      name: hcp-cli
      namespace: cluster-provisioning
      argoProject: infrastructure
      path: charts/all/hcp-cli

    kubelet-config:
      disabled: true
      name: kubelet-config
      namespace: openshift-machine-config-operator
      argoProject: hub
      path: charts/all/kubelet-config
      annotations:
        argocd.argoproj.io/sync-wave: "999"
      ignoreDifferences:
        - group: machineconfiguration.openshift.io
          kind: KubeletConfig
          jqPathExpressions:
            - .metadata.annotations

    # Static local PVs only if installing on a hosted cluster (platform None). Hub has hostpath-csi.
    local-storage:
      disabled: true
      name: local-storage
      namespace: local-storage
      argoProject: infrastructure
      path: charts/all/local-storage
      annotations:
        argocd.argoproj.io/sync-wave: "10"

  imperative:
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    # For additional overrides that apply to the jobs, please refer to
    # https://hybrid-cloud-patterns.io/imperative-actions/#additional-job-customizations
    namespace: imperative
    jobs:
    - name: hello-world
      # ansible playbook to be run
      playbook: rhvp.cluster_utils.hello_world
      # per playbook timeout in seconds
      timeout: 234
      # verbosity: "-v"

  # ACM-managed spoke groups are omitted: this install only adds Tekton/secrets
  # on the existing hub and does not manage hosted clusters via ACM.
