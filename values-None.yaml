# Auto-loaded only if kubeconfig points at a hosted cluster (platform None).
# Default install targets the BareMetal hub; keep these guards if retargeted.

letsencrypt:
  region: ""

clusterGroup:
  applications:
    cert-manager:
      disabled: true
    autoscaler:
      disabled: true
    kubelet-config:
      disabled: true
    local-storage:
      disabled: false
    oauth:
      disabled: true

localStorage:
  enabled: true
  nodes:
    - hcptest-worker-0-0
    - hcptest-worker-0-1
