# Auto-loaded when the target cluster platform is BareMetal (libvirt-simulated BM hub).
# Skip AWS-only components. Hub already has hostpath-csi. OAuth is allowed on the hub.

letsencrypt:
  region: ""

clusterGroup:
  applications:
    cert-manager:
      disabled: true
    autoscaler:
      disabled: true
    kubelet-config:
      disabled: true
    local-storage:
      disabled: true
    oauth:
      disabled: false

localStorage:
  enabled: false
